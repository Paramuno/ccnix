# Force Wayland natively
gpu-context=wayland

# Cap at 1080p MP4 + best audio — faster format resolution
ytdl-format=bestvideo[ext=mp4][height<=1080]+bestaudio[ext=m4a]/best

# Hardware decoding — switch to auto-safe if crashes are resolved
hwdec=no

# Start playback sooner while buffering ahead
demuxer-max-bytes=50MiB

# Use exported cookie file instead of live browser extraction (much faster)
# Refreshed weekly by systemd timer
ytdl-raw-options=cookies=~/.local/share/yt-dlp/cookies.txt


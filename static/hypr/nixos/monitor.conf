# ==========================================
# 1. NixOS Workstation (4K Monitor)
# ==========================================
# Replace 'DP-1' with 'HDMI-A-1' if you are using HDMI on the workstation.
# Note: A scale of 1.5 is often required on 4K so text isn't microscopic. 
# Change to 1 if you want raw, unscaled 4K real estate.
# monitor=DP-1, 3840x2160@60, auto, 1.5
# monitor=HDMI-A-1, 3840x2160@60, auto, 1.75

monitor=eDP-1, highres, auto, 1.5

# ==========================================
# 3. The Universal Fallback (The Magic Rule)
# ==========================================
# If Hyprland encounters a screen that isn't explicitly named above 
# (like plugging into a random projector or a new TV), it will automatically 
# use the display's maximum preferred resolution at a scale of 1.
monitor=, preferred, auto, 2


# Usual HDMI monitor:
# monitor=HDMI-A-1,3840x2160@60,auto,1,transform,3
# monitor=HDMI-A-1,1920x1080@60,auto,1,transform,3

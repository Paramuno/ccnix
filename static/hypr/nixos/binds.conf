# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more

# SUPER key
$mainMod = SUPER

# > /tmp/vault-debug.log 2>&1   this redirects scripts errors to logfiles
# Custom mara
bind = $mainMod, O, exec, obsidian
bind = $mainMod SHIFT, O, exec, ~/.scripts/obsidian-mount.sh > /tmp/vault-debug.log 2>&1
 
bind = $mainMod, T, exec, kitty -e vifm
bind = $mainMod, U, exec, kitty -e nvim
bind = $mainMod, Y, exec, kitty -e yazi

# Play copied YouTube URL in mpv and send a desktop notification
bind = $mainMod SHIFT, Y, exec, mpv-clipboard

# Kitty opacity toggle
bind = $mainMod, D, exec, ~/.scripts/toggle_kitty_opacity.sh
bind = $mainMod, Z, exec, ~/.scripts/toggle-touchpad.sh 

# bind = $mainMod, C, exec, alacritty -e calcurse # Run calcurse
bind = $mainMod, C, exec, hyprshot -m region --clipboard-only # Clipboard screenshot
# bind = $mainMod, C, exec, hyprshot -z -m output --clipboard-only # Clipboard screenshot

# bind = switch:Lid Switch, exec, hyprctl keyword monitor "eDP-1, disable" # Disable monitor when closing lid
# bindl = ,switch:Lid Switch, exec, systemctl suspend # Hybernate when closing lid
# bindl = , switch:Lid Switch, exec, systemctl hibernate

# Emergency Screen Reset: Press Super + Shift + R to force screen ON
# bind = $mainMod, R, exec, hyprctl keyword monitor "eDP-1, 1920x1080@60, 0x0, 1"
# Rotate 4k screen
bind = $mainMod, R, exec, ~/.scripts/rotate.sh
# Press Super + P to toggle the laptop screen on/off
bind = $mainMod SHIFT, R, exec, hyprctl monitors | grep "eDP-1" && hyprctl keyword monitor "eDP-1, disable" || hyprctl keyword monitor "eDP-1, preferred, auto, 1"

# Waybar toggle
bindit = $mainMod, SUPER_L, exec, pkill -SIGUSR1 waybar
bindirt = $mainMod, SUPER_L, exec, pkill -SIGUSR1 waybar
bind = $mainMod, W, exec, pkill -SIGUSR1 waybar 

# Actions
bind = $mainMod, RETURN, exec, kitty -- zsh -c "zellij attach -c -f cc1; exec zsh"
bind = $mainMod CTRL SHIFT ALT, RETURN, exec, kitty
bind = $mainMod SHIFT, RETURN, exec, kitty zsh -ic "v" # Neovim open fzf direct on home
bind = $mainMod, Q, killactive # Close current window
bind = $mainMod, M, exit # Exit Hyprland
# bind = $mainMod, M, exec, bash -c 'systemctl --user stop graphical-session.target && hyprctl dispatch exit'
bind = $mainMod SHIFT, M, exec, systemctl suspend # Sleep
bind = $mainMod, E, exec, ~/.scripts/filemanager.sh # Opens thunar
bind = $mainMod, G, togglefloating # Toggle between tiling and floating window
bind = $mainMod, F, fullscreen # Open the window in fullscreen
bind = $mainMod CTRL, RETURN, exec, rofi -show drun # Open rofi
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, N, togglesplit, # dwindle
bind = $mainMod, B, exec, firefox
bind = $mainMod SHIFT, B, exec, ~/.scripts/reload-waybar.sh # Reload Waybar
bind = $mainMod SHIFT, W, exec, ~/.scripts/reload-hyprpaper.sh # Reload hyprpaper after a changing the wallpaper

# Special keys
binde = , XF86MonBrightnessDown, exec, brightnessctl set 10%-
binde = , XF86MonBrightnessUp, exec, brightnessctl set 10%+
bind = , xf86audioraisevolume, exec, wpctl set-volume -l 1.0 @DEFAULT_SINK@ 5%+
bind = , xf86audiolowervolume, exec, wpctl set-volume -l 1.0 @DEFAULT_SINK@ 5%-
bind = , xf86audiomute, exec, wpctl set-mute @DEFAULT_SINK@ toggle


#====== WINDOWS
# bind = $mainMod, S, easymotion, action:hyprctl dispatch focuswindow address:{} # Select window with easymotion

# Move focus with mainMod + arrow keys
bind = $mainMod, H, movefocus, l # Move focus left
bind = $mainMod, L, movefocus, r # Move focus right
bind = $mainMod, K, movefocus, u # Move focus up
bind = $mainMod, J, movefocus, d # Move focus down

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1 # Switch to workspace 1
bind = $mainMod, 2, workspace, 2 # Switch to workspace 2
bind = $mainMod, 3, workspace, 3 # Switch to workspace 3
bind = $mainMod, 4, workspace, 4 # Switch to workspace 4
bind = $mainMod, 5, workspace, 5 # Switch to workspace 5
bind = $mainMod, 6, workspace, 6 # Switch to workspace 6
bind = $mainMod, 7, workspace, 7 # Switch to workspace 7
bind = $mainMod, 8, workspace, 8 # Switch to workspace 8

# Agnostic brightnessctl adjustment
binde = $mainMod, 9, exec, brightnessctl set 10%-
binde = $mainMod, 0, exec, brightnessctl set 10%+

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1 #  Move window to workspace 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2 #  Move window to workspace 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3 #  Move window to workspace 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4 #  Move window to workspace 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5 #  Move window to workspace 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6 #  Move window to workspace 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7 #  Move window to workspace 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8 #  Move window to workspace 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9 #  Move window to workspace 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10 #  Move window to workspace 10

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1 # Scroll workspaces 
bind = $mainMod, mouse_up, workspace, e-1 # Scroll workspaces

# Move/resize windows with mainMod + LMB/RMB and dragging
#bindm = $mainMod, mouse:272, movewindow # Move window
#bindm = $mainMod, mouse:273, resizewindow # Resize window
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, right, moveactive, 80 0 # Resize window
bind = $mainMod SHIFT, left, moveactive, -80 0 # Resize window
bind = $mainMod SHIFT, down, moveactive, 0 50 # Resize window
bind = $mainMod SHIFT, up, moveactive, 0 -50 # Resize window
bind = $mainMod, right, resizeactive, 80 0 # Resize window
bind = $mainMod, left, resizeactive, -80 0 # Resize window
bind = $mainMod, down, resizeactive, 0 50 # Resize window
bind = $mainMod, up, resizeactive, 0 -50 # Resize window

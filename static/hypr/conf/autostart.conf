exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# Execute your favorite apps at launch
exec-once = waybar
exec-once = hyprpaper
exec-once = dunst
exec-once = hypridle

# Safety and authentication
exec-once = protonvpn-app

# Services and servers
# exec-once = sudo input-remapper-service
# exec-once = input-remapper-control --command autoload

# exec-once = sudo ~./config/kanata_linux_cmd_allowed_x64

# Hyper custom config
exec = ~/.config/hypr/hyprctl.sh 

# Plugin Initialization this is done now on the generated hyprland.conf file for Fedora flake

general {
    # lock_cmd = pidof hyprlock || hyprlock       # command run before sleep
    lock_cmd = ~/.scripts/lock.sh
    before_sleep_cmd = loginctl lock-session    # command run before sleep
    after_sleep_cmd = hyprctl dispatch dpms on  # command run after sleep
}

listener {
    timeout = 500
    on-timeout = loginctl lock-session           # lock screen
}

listener {
    timeout = 500                               # 1800 secs - 30 min
    on-timeout = hyprctl dispatch dpms off       # turn off monitor
    on-resume = hyprctl dispatch dpms on         # turn on monitor
}

set-option -g default-shell /usr/bin/zsh

# Enable the Kitty Keyboard Protocol for complex chords
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Unbind the default prefix
unbind C-b

# Set the new prefix to Ctrl + Alt + Shift + a
# set -g prefix C-M-a
set -g prefix C-M-S-a
# set -g prefix ¤

# Ensure that pressing the prefix twice sends the actual keystroke to the program inside
# bind C-M-a send-prefix
bind C-M-S-a send-prefix
# bind ¤ send-prefix

# Reload the configuration file instantly with Prefix + r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# Fix colors for Neovim compatibility
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Remove escape key delay (crucial for Vim users)
set -sg escape-time 0

# ==========================
# Window & Pane Management (Vim Style)
# ==========================

# Split panes using v (vertical) and s (horizontal)
# This mimics Neovim's :vsplit and :split
bind v split-window -h
bind s split-window -v
unbind '"'
unbind %

# Navigate panes using h, j, k, l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes using uppercase H, J, K, L
# The -r flag makes it repeatable (e.g., Prefix, hold Shift, tap H H H)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ==========================
# Copy Mode & Clipboard (Wayland / Hyprland)
# ==========================

# Use Vim keybindings in copy mode
set-window-option -g mode-keys vi

# Start selection with 'v' and yank with 'y'
bind -T copy-mode-vi 'v' send -X begin-selection

# Yank selection directly into the Wayland clipboard using wl-copy
bind -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "wl-copy"

# Clear selection with Escape
bind -T copy-mode-vi Escape send -X clear-selection

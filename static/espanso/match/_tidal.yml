# Tidalcycles and other code snippets, inject here for faster coding and patterning
# NOTE: This file is prefixed with _ so as not to autoload it in Espanso
  
# NOTE: We define cursor pos with $|$ 
# > | decides multiline - decides no newline after
  # - trigger: ":a"
  #   replace: >-
  #           asap $ s "$|$"
  #   force_clipboard : true
  # NOTE: VIM reads $|$ as literal <Left> movements, doesn't match well with insert mode 
    # "supersaw($|$)" results in <Left>
 
# NOTE: We need to escape \\ backslashes for valid YAML

global_vars:
  - name: spc
    type: echo
    params:
      echo: " "

matches:
  - trigger: "|at"
    replace: >-
           asap $ t "

  - trigger: "|S"
    replace: >-
            $ sound "

  - trigger: "|st"
    replace: |-
            $ stack
            [
            {{spc}}{{spc}}
    # This one doesn't have o because it's rare to hit sb|
  - regex: "sb(?P<var>.*)\\|"
    replace: >-
            $ sometimesBy 0.{{var}} (
  - regex: "sc(?P<var>.*)\\|"
    replace: >-
            $ someCyclesBy 0.{{var}} (

  - trigger: "|ss"
    replace: >-
            "supersaw

  - trigger: "|sg"
    replace: >-
            "supergong

    # These ones have o to avoid normal mode issues
  - regex: "ot(?P<var>.*)\\|"
    replace: |-
            
            d{{var}} $ t "
  - regex: "od(?P<var>.*)\\|"
    replace: |-
            
            d{{var}}
            {{spc}}{{spc}}
  # NOTE: We can replace like this
  - regex: "greet(?P<person>.*)\\."
    replace: "Hi {{person}}!"

    
